name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Generate the Android project
        run: |
          set -e
          mkdir -p /tmp/proj && cd /tmp/proj
          mkdir -p "app"
          cat > 'app/build.gradle' <<'EOF_0'
          plugins { id 'com.android.application' }
          android {
              namespace 'app.elagi'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.elagi'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          EOF_0
          mkdir -p "app/src/main"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_1'
