          package app.elagi;
 
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
 
          import androidx.core.app.NotificationCompat;
 
          import java.util.Locale;
 
          /** Plays the bell, then speaks the reminder aloud, even if the app is closed. */
          public class AlarmService extends Service {
              private static final String CH = "elagi_alarm";
              private static final int NID = 4201;
              private final Handler h = new Handler(Looper.getMainLooper());
              private TextToSpeech tts;
              private MediaPlayer mp;
              private PowerManager.WakeLock wl;
              private int gen = 0;
              private String lastTitle = "عِلاجي", lastBody = "";
 
              @Override public IBinder onBind(Intent i) { return null; }
 
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) { finish(); return START_NOT_STICKY; }
                  final int my = ++gen;
                  String title = intent != null ? intent.getStringExtra("title") : null;
                  String body = intent != null ? intent.getStringExtra("body") : null;
                  final String text = intent != null ? intent.getStringExtra("text") : null;
                  if (title == null) title = "عِلاجي";
                  if (body == null) body = "";
                  lastTitle = title; lastBody = body;
                  channel();
                  Notification n = build(title, body, true);
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      else startForeground(NID, n);
                  } catch (Exception e) {
                      try { ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).notify(NID, n); } catch (Exception ignored) {}
                  }
                  try {
                      if (wl == null) {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "elagi:alarm");
                      }
                      if (!wl.isHeld()) wl.acquire(3 * 60 * 1000L);
                  } catch (Exception ignored) {}
                  releasePlayers();
                  chime(new Runnable() { @Override public void run() { if (my == gen) speak(text, my); } });
                  h.postDelayed(new Runnable() { @Override public void run() { if (my == gen) finish(); } }, 90 * 1000L);
                  return START_NOT_STICKY;
              }
 
              private void channel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(CH, "تنبيهات الأدوية", NotificationManager.IMPORTANCE_HIGH);
                      c.setSound(null, null);
                      c.enableVibration(true);
                      c.setVibrationPattern(new long[]{0, 400, 150, 400, 150, 600});
                      c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(c);
                  }
              }
 
              private Notification build(String title, String body, boolean ongoing) {
                  Intent open = new Intent(this, MainActivity.class);
                  open.putExtra("alarm", true);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 11, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Intent stop = new Intent(this, AlarmService.class).setAction("STOP");
                  PendingIntent sp = PendingIntent.getService(this, 12, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CH)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(title).setContentText(body)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_ALARM)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setContentIntent(pi)
                          .addAction(0, "إيقاف الصوت", sp)
                          .setOngoing(ongoing).setAutoCancel(!ongoing);
                  if (ongoing) b.setFullScreenIntent(pi, true);
                  return b.build();
              }
 
              private void chime(final Runnable done) {
                  try {
                      Uri u = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                      mp.setDataSource(this, u);
                      mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener() {
                          @Override public void onCompletion(MediaPlayer m) { done.run(); }
                      });
                      mp.setOnErrorListener(new MediaPlayer.OnErrorListener() {
                          @Override public boolean onError(MediaPlayer m, int w, int e) { done.run(); return true; }
                      });
                      mp.prepare();
                      mp.start();
                  } catch (Exception e) {
                      done.run();
                  }
              }
 
              private void speak(final String text, final int my) {
                  if (text == null || text.trim().isEmpty()) { finish(); return; }
                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                      @Override public void onInit(int status) {
                          if (my != gen) return;
                          if (status != TextToSpeech.SUCCESS || tts == null) { finish(); return; }
                          try { tts.setLanguage(new Locale("ar")); } catch (Exception ignored) {}
                          try {
                              tts.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                          } catch (Exception ignored) {}
                          tts.setSpeechRate(0.9f);
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) {}
                              @Override public void onError(String id) { if ("last".equals(id)) h.post(new Runnable() { @Override public void run() { finish(); } }); }
                              @Override public void onDone(String id) { if ("last".equals(id)) h.post(new Runnable() { @Override public void run() { finish(); } }); }
                          });
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "a");
                          tts.playSilentUtterance(1500, TextToSpeech.QUEUE_ADD, "s1");
                          tts.speak(text, TextToSpeech.QUEUE_ADD, null, "b");
                          tts.playSilentUtterance(1500, TextToSpeech.QUEUE_ADD, "s2");
                          tts.speak(text, TextToSpeech.QUEUE_ADD, null, "last");
                      }
                  });
              }
 
              private void releasePlayers() {
                  try { if (mp != null) { mp.release(); } } catch (Exception ignored) {}
                  mp = null;
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception ignored) {}
                  tts = null;
              }
 
              private void finish() {
                  releasePlayers();
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception ignored) {}
                  if (Build.VERSION.SDK_INT >= 24) stopForeground(Service.STOP_FOREGROUND_DETACH); else stopForeground(false);
                  try { ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).notify(NID, build(lastTitle, lastBody, false)); } catch (Exception ignored) {}
                  stopSelf();
              }
 
              @Override public void onDestroy() { releasePlayers(); super.onDestroy(); }
          }
          EOF_5
          mkdir -p "app/src/main/java/app/elagi"
          cat > 'app/src/main/java/app/elagi/BootReceiver.java' <<'EOF_6'
          package app.elagi;
 
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
 
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  AlarmScheduler.scheduleAll(c);
              }
          }
          EOF_6
          mkdir -p "app/src/main/java/app/elagi"
          cat > 'app/src/main/java/app/elagi/MainActivity.java' <<'EOF_7'
          package app.elagi;
 
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
 
          import androidx.core.content.FileProvider;
 
          import java.io.File;
          import java.io.InputStream;
          import java.util.ArrayList;
 
          public class MainActivity extends Activity {
              private static final String START = "https://omg-medtech.github.io/Elagi-app/";
              private static final int REQ_FILE = 51, REQ_PERM = 52;
              static volatile boolean visible = false;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private Uri camUri;
              private String inject = "";
 
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  showOverLock(getIntent());
                  try {
                      InputStream is = getAssets().open("inject.js");
                      byte[] buf = new byte[is.available()];
                      is.read(buf);
                      is.close();
                      inject = new String(buf, "UTF-8");
                  } catch (Exception ignored) {}
 
                  web = new WebView(this);
                  setContentView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setAllowFileAccess(false);
                  s.setUserAgentString(s.getUserAgentString() + " ElagiAPK/1.0");
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  web.addJavascriptInterface(new WebBridge(getApplicationContext()), "AndroidElagi");
 
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView v, String url, android.graphics.Bitmap f) { v.evaluateJavascript(inject, null); }
                      @Override public void onPageFinished(WebView v, String url) { v.evaluateJavascript(inject, null); }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sc = u.getScheme();
                          if ("https".equals(sc) || "http".equals(sc)) {
                              String host = u.getHost() == null ? "" : u.getHost();
                              if (host.endsWith("github.io") || host.endsWith("supabase.co") || host.endsWith("supabase.com")) return false;
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                              return true;
                          }
                          if ("blob".equals(sc) || "data".equals(sc) || "about".equals(sc)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) { cb.invoke(origin, true, false); }
                      @Override public void onPermissionRequest(final PermissionRequest r) { runOnUiThread(new Runnable() { @Override public void run() { r.grant(r.getResources()); } }); }
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) { return chooseFile(cb); }
                  });
                  web.setDownloadListener(new android.webkit.DownloadListener() {
                      @Override public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          if (url != null && url.startsWith("blob:")) {
                              String name = android.webkit.URLUtil.guessFileName(url, cd, mime);
                              String js = "(function(){fetch('" + url + "').then(function(r){return r.blob()}).then(function(bl){var fr=new FileReader();fr.onloadend=function(){var d=String(fr.result);AndroidElagi.saveFile('" + name.replace("'", "") + "','" + (mime == null ? "" : mime) + "',d.substring(d.indexOf(',')+1))};fr.readAsDataURL(bl)})})()";
                              web.evaluateJavascript(js, null);
                          } else if (url != null) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                          }
                      }
                  });
 
                  askPermissions();
                  if (b != null) web.restoreState(b); else web.loadUrl(START);
              }
 
              private void showOverLock(Intent i) {
                  if (i != null && i.getBooleanExtra("alarm", false)) {
                      if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                      else getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
              }
 
              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  showOverLock(i);
                  if (web != null) web.evaluateJavascript("try{checkDue()}catch(e){}", null);
              }
 
              private void askPermissions() {
                  ArrayList<String> need = new ArrayList<String>();
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.POST_NOTIFICATIONS);
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.CAMERA);
                  if (!need.isEmpty()) requestPermissions(need.toArray(new String[0]), REQ_PERM);
              }
 
              private boolean chooseFile(ValueCallback<Uri[]> cb) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                  pick.addCategory(Intent.CATEGORY_OPENABLE);
                  pick.setType("image/*");
                  Intent chooser = Intent.createChooser(pick, "اختر صورة الدواء");
                  try {
                      File f = File.createTempFile("cam_", ".jpg", getCacheDir());
                      camUri = FileProvider.getUriForFile(this, "app.elagi.files", f);
                      Intent cam = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      cam.putExtra(MediaStore.EXTRA_OUTPUT, camUri);
                      cam.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cam});
                  } catch (Exception e) {
                      camUri = null;
                  }
                  try {
                      startActivityForResult(chooser, REQ_FILE);
                  } catch (Exception e) {
                      fileCb = null;
                      cb.onReceiveValue(null);
                      return false;
                  }
                  return true;
              }
 
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req != REQ_FILE) { super.onActivityResult(req, res, data); return; }
                  Uri[] out = null;
                  if (res == RESULT_OK) {
                      if (data != null && data.getData() != null) out = new Uri[]{data.getData()};
                      else if (camUri != null) out = new Uri[]{camUri};
                  }
                  if (fileCb != null) { fileCb.onReceiveValue(out); fileCb = null; }
              }
 
              @Override
              protected void onSaveInstanceState(Bundle b) { super.onSaveInstanceState(b); if (web != null) web.saveState(b); }
 
              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else moveTaskToBack(true);
              }
 
              @Override protected void onResume() { super.onResume(); visible = true; if (web != null) web.onResume(); }
              @Override protected void onPause() { super.onPause(); visible = false; if (web != null) web.onPause(); }
          }
