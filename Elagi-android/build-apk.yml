          cat > 'app/src/main/java/app/elagi/WebBridge.java' <<'EOF_10'
          package app.elagi;

          import android.content.ContentValues;
          import android.content.Context;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          /** Exposed to the page as window.AndroidElagi. */
          public class WebBridge {
              private final Context ctx;
              WebBridge(Context c) { ctx = c; }

              @JavascriptInterface
              public void sync(String json) { AlarmScheduler.sync(ctx, json); }

              @JavascriptInterface
              public void testAlarm(String text) {
                  try {
                      org.json.JSONArray a = new org.json.JSONArray();
                      org.json.JSONObject o = new org.json.JSONObject();
                      o.put("id", "test"); o.put("at", System.currentTimeMillis() + 20000);
                      o.put("title", "عِلاجي"); o.put("body", "اختبار التنبيه"); o.put("text", text);
                      a.put(o);
                      // keep the real schedule: merge with the saved list
                      AlarmScheduler.addOne(ctx, o);
                  } catch (Exception ignored) {}
              }

              private static android.speech.tts.TextToSpeech tts;
              private static boolean ttsReady = false;
              private static String pending = null;

              @JavascriptInterface
              public void speak(final String text) {
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() {
                          try {
                              if (tts == null) {
                                  pending = text;
                                  tts = new android.speech.tts.TextToSpeech(ctx, new android.speech.tts.TextToSpeech.OnInitListener() {
                                      @Override public void onInit(int status) {
                                          if (status != android.speech.tts.TextToSpeech.SUCCESS) { tts = null; return; }
                                          try {
                                              int r1 = tts.setLanguage(new java.util.Locale("ar"));
                                              if (r1 == android.speech.tts.TextToSpeech.LANG_MISSING_DATA || r1 == android.speech.tts.TextToSpeech.LANG_NOT_SUPPORTED) tts.setLanguage(new java.util.Locale("ar", "EG"));
                                          } catch (Exception ignored) {}
                                          tts.setSpeechRate(0.9f);
                                          ttsReady = true;
                                          if (pending != null) { tts.speak(pending, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "w"); pending = null; }
                                      }
                                  });
                              } else if (ttsReady) {
                                  tts.speak(text, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "w");
                              } else {
                                  pending = text;
                              }
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @JavascriptInterface
              public void stopSpeak() {
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() { try { if (tts != null && ttsReady) tts.stop(); pending = null; } catch (Exception ignored) {} }
                  });
              }

              @JavascriptInterface
              public void setTheme(boolean dark) {
                  ctx.getSharedPreferences("elagi_setup", Context.MODE_PRIVATE).edit().putBoolean("dark", dark).apply();
              }

              @JavascriptInterface
              public void ready() {
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() { if (MainActivity.cur != null) MainActivity.cur.hideSplash(); }
                  });
              }

              @JavascriptInterface
              public void saveFile(String name, String mime, String b64) {
                  try {
                      byte[] data = Base64.decode(b64, Base64.DEFAULT);
                      if (name == null || name.trim().isEmpty()) name = "elagi-" + System.currentTimeMillis() + ".pdf";
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          android.net.Uri u = ctx.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (u == null) throw new Exception("insert");
                          OutputStream o = ctx.getContentResolver().openOutputStream(u);
                          o.write(data);
                          o.close();
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          dir.mkdirs();
                          FileOutputStream o = new FileOutputStream(new File(dir, name));
                          o.write(data);
                          o.close();
                      }
                      toast("تم الحفظ في مجلد التنزيلات: " + name);
                  } catch (Exception e) {
                      toast("تعذّر حفظ الملف");
                  }
              }

              private void toast(final String m) {
                  android.os.Handler h = new android.os.Handler(android.os.Looper.getMainLooper());
                  h.post(new Runnable() { @Override public void run() { Toast.makeText(ctx, m, Toast.LENGTH_LONG).show(); } });
              }
          }
