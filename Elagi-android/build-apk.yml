          package app.elagi;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PathMeasure;
          import android.view.View;
          import android.view.animation.LinearInterpolator;

          /** The pill logo that paints itself: coral half, teal half, then the check mark. */
          public class LogoView extends View {
              private final Paint coral = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint teal = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint check = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path capsule = new Path();
              private final Path checkPath = new Path();
              private final Path seg = new Path();
              private float t = 0f;
              private ValueAnimator anim;

              public LogoView(Context c) {
                  super(c);
                  coral.setColor(0xFFEE7666);
                  teal.setColor(0xFF04A093);
                  check.setColor(0xFFFFFFFF);
                  check.setStyle(Paint.Style.STROKE);
                  check.setStrokeCap(Paint.Cap.ROUND);
                  check.setStrokeJoin(Paint.Join.ROUND);
              }

              private static float ease(float x) {
                  x = Math.max(0f, Math.min(1f, x));
                  return x * x * (3f - 2f * x);
              }

              @Override
              protected void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  anim = ValueAnimator.ofFloat(0f, 3.7f);
                  anim.setDuration(2800);
                  anim.setInterpolator(new LinearInterpolator());
                  anim.setRepeatCount(ValueAnimator.INFINITE);
                  anim.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                      @Override public void onAnimationUpdate(ValueAnimator a) { t = (Float) a.getAnimatedValue(); invalidate(); }
                  });
                  anim.start();
              }

              @Override
              protected void onDetachedFromWindow() {
                  if (anim != null) anim.cancel();
                  super.onDetachedFromWindow();
              }

              @Override
              protected void onDraw(Canvas c) {
                  float s = Math.min(getWidth(), getHeight()), u = s / 200f;
                  float L = 70f * u, R = 30f * u, g = 2f * u;
                  capsule.reset();
                  capsule.addRoundRect(-L, -R, L, R, R, R, Path.Direction.CW);

                  c.save();
                  c.translate(getWidth() / 2f, getHeight() / 2f);
                  c.save();
                  c.rotate(-45f);
                  c.clipPath(capsule);
                  float a = ease(t);                 // coral reveals from its outer end
                  float b = ease(t - 1f);            // then teal
                  if (a > 0f) c.drawRect(-L, -R, -L + (L - g) * a, R, coral);
                  if (b > 0f) c.drawRect(L - (L - g) * b, -R, L, R, teal);
                  c.restore();

                  float k = ease(t - 2f);            // finally the check mark
                  if (k > 0f) {
                      checkPath.reset();
                      checkPath.moveTo(-22f * u, 0f);
                      checkPath.lineTo(-8f * u, 14f * u);
                      checkPath.lineTo(24f * u, -18f * u);
                      PathMeasure pm = new PathMeasure(checkPath, false);
                      seg.reset();
                      pm.getSegment(0f, pm.getLength() * k, seg, true);
                      check.setStrokeWidth(11f * u);
                      c.drawPath(seg, check);
                  }
                  c.restore();
              }
          }
