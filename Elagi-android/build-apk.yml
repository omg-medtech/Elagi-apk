                              .setContentIntent(pi).setFullScreenIntent(PendingIntent.getActivity(c, 15, new Intent(c, AlarmActivity.class).putExtra("title", title).putExtra("body", body).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT), true).setAutoCancel(true).build();
