name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > /tmp/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install Gradle 8.7
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          sudo unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Generate the Android project
        run: |
          set -e
          mkdir -p /tmp/proj && cd /tmp/proj
          mkdir -p "app"
          cat > 'app/build.gradle' <<'EOF_0'
          plugins { id 'com.android.application' }
          android {
              namespace 'app.elagi'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.elagi'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          EOF_0
          mkdir -p "app/src/main"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.location" android:required="false"/>

              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>

              <application
                  android:label="عِلاجي"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|locale|layoutDirection"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="elagi" android:host="auth"/>
                      </intent-filter>
                  </activity>

                  <activity android:name=".AlarmActivity"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"/>

                  <receiver android:name=".AlarmReceiver" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>

                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="app.elagi.files" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF_1
          mkdir -p "app/src/main/assets"
          cat > 'app/src/main/assets/inject.js' <<'EOF_2'
          (function(){
            if(window.__elagiNative)return;window.__elagiNative=true;
            /* WebView has no Notification API: report it as granted so the sign-up gate passes (reminders are native here) */
            try{
              if(!("Notification" in window)||Notification.permission!=="granted"){
                var N=function(){};N.permission="granted";N.requestPermission=function(cb){if(cb)cb("granted");return Promise.resolve("granted")};
                Object.defineProperty(window,"Notification",{value:N,configurable:true,writable:true});
              }
            }catch(e){}
            /* save PDFs/files generated in the page (blob downloads) to the Downloads folder */
            function saveBlobLink(a){
              var n=a.download||("elagi-"+Date.now()+".pdf");
              fetch(a.href).then(function(r){return r.blob()}).then(function(bl){var fr=new FileReader();fr.onloadend=function(){var d=String(fr.result);AndroidElagi.saveFile(n,bl.type||"",d.substring(d.indexOf(",")+1))};fr.readAsDataURL(bl)});
            }
            try{
              var oc=HTMLAnchorElement.prototype.click;
              HTMLAnchorElement.prototype.click=function(){if(this.download&&/^blob:/.test(this.href)){saveBlobLink(this);return}return oc.apply(this,arguments)};
              var od=EventTarget.prototype.dispatchEvent;
              EventTarget.prototype.dispatchEvent=function(e){if(this instanceof HTMLAnchorElement&&e&&e.type==="click"&&this.download&&/^blob:/.test(this.href)){saveBlobLink(this);return true}return od.apply(this,arguments)};
            }catch(e){}
            function sync(){
              try{
                if(typeof S==="undefined"||!S.user||typeof window.__alarmText!=="function"){return}
                var now=Date.now(),L=[],u=S.user;
                (u.meds||[]).forEach(function(m){if(m.nextAt>now+2000)L.push({id:"m"+m.id,at:m.nextAt,title:"عِلاجي",body:String(m.name||"").split(/\s+/).slice(0,3).join(" "),text:window.__alarmText("med",m)})});
                (u.tests||[]).forEach(function(t){if(!t.done&&t.at>now+2000)L.push({id:"t"+t.id,at:t.at,title:"عِلاجي",body:t.ar||"",text:window.__alarmText("test",t)})});
                L.sort(function(a,b){return a.at-b.at});
                AndroidElagi.sync(JSON.stringify(L.slice(0,60)));
              }catch(e){}
            }
            var rdy=setInterval(function(){try{if(window.__bootDone||(typeof S!=="undefined"&&S.user)){AndroidElagi.ready();clearInterval(rdy)}}catch(e){}},300);
            /* WebView has no usable speechSynthesis: route the app's voice through Android TTS */
            var vv=setInterval(function(){try{
              if(typeof Voice!=="undefined"&&Voice&&Voice.say){
                Voice.say=function(parts){try{if(typeof S!=="undefined"&&S.user&&S.user.set&&S.user.set.voice===false)return;AndroidElagi.speak((parts||[]).map(function(p){return p.t}).filter(Boolean).join(". "))}catch(e){}};
                Voice.stop=function(){try{AndroidElagi.stopSpeak()}catch(e){}};
                clearInterval(vv);
              }}catch(e){}},500);

            /* ---- own time / date pickers (the system dialogs get cut off on some phones) ---- */
            var PCSS=false;
            function pcss(){
              if(PCSS||!document.head)return;PCSS=true;
              var s=document.createElement("style");
              s.textContent=".elp-bg{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;font-family:inherit}"+
              ".elp{width:100%;max-width:480px;background:var(--card,#fff);color:var(--ink,#3D464B);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.3)}"+
              ".elp h4{margin:0 0 10px;text-align:center;font-size:18px}"+
              ".elr{display:flex;direction:ltr;gap:6px;position:relative}"+
              ".elwrap{position:relative;flex:1;height:220px}"+
              ".elw{position:relative;z-index:1;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}"+
              ".elw::-webkit-scrollbar{display:none}"+
              ".elw div{height:44px;line-height:44px;text-align:center;font-size:22px;font-weight:600;scroll-snap-align:center;color:var(--ink-2,#5E6A70)}"+
              ".elw div.sp{height:88px;scroll-snap-align:none}"+
              ".elband{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--teal-soft,#E2F5F3);opacity:.7;pointer-events:none}"+
              ".elp .ra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}"+
              ".elp .ra button{min-height:52px;border-radius:16px;border:2px solid var(--teal,#04A093);background:transparent;color:var(--teal,#04A093);font:700 17px inherit;font-family:inherit}"+
              ".elp .ra button.ok{background:var(--teal,#04A093);color:#fff}";
              document.head.appendChild(s);
            }
            function pad2(n){return(n<10?"0":"")+n}
            function wheel(items,idx){
              var wrap=document.createElement("div");wrap.className="elwrap";
              var w=document.createElement("div");w.className="elw";
              var a=document.createElement("div");a.className="sp";w.appendChild(a);
              items.forEach(function(t){var d=document.createElement("div");d.textContent=t;w.appendChild(d)});
              var b=document.createElement("div");b.className="sp";w.appendChild(b);
              var band=document.createElement("div");band.className="elband";
              wrap.appendChild(band);wrap.appendChild(w);
              wrap.get=function(){return Math.max(0,Math.min(items.length-1,Math.round(w.scrollTop/44)))};
              wrap.set=function(i){w.scrollTop=i*44};
              wrap.init=idx;
              return wrap;
            }
            function openSheet(title,wheels,onOk){
              pcss();
              var bg=document.createElement("div");bg.className="elp-bg";
              var box=document.createElement("div");box.className="elp";
              var h=document.createElement("h4");h.textContent=title;box.appendChild(h);
              var row=document.createElement("div");row.className="elr";wheels.forEach(function(w){row.appendChild(w)});box.appendChild(row);
              var ra=document.createElement("div");ra.className="ra";
              var c=document.createElement("button");c.type="button";c.textContent="إلغاء";
              var o=document.createElement("button");o.type="button";o.className="ok";o.textContent="تم";
              ra.appendChild(c);ra.appendChild(o);box.appendChild(ra);bg.appendChild(box);document.body.appendChild(bg);
              wheels.forEach(function(w){w.set(w.init)});
              function close(){try{bg.remove()}catch(e){}}
              c.onclick=close;bg.addEventListener("click",function(e){if(e.target===bg)close()});
              o.onclick=function(){onOk();close()};
            }
            function setVal(inp,v){
              var set=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value").set;set.call(inp,v);
              inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));
            }
            function pickTime(inp){
              var m=/^(\d{1,2}):(\d{2})/.exec(inp.value||""),h=m?+m[1]:9,mi=m?+m[2]:0,pm=h>=12,h12=h%12===0?12:h%12;
              var hs=[],ms=[],i;for(i=1;i<=12;i++)hs.push(String(i));for(i=0;i<60;i++)ms.push(pad2(i));
              var wh=wheel(hs,h12-1),wm=wheel(ms,mi),wa=wheel(["ص","م"],pm?1:0);
              openSheet("اختر الوقت",[wh,wm,wa],function(){
                var hh=wh.get()+1,p=wa.get()===1;if(hh===12)hh=0;if(p)hh+=12;
                setVal(inp,pad2(hh)+":"+pad2(wm.get()));
              });
            }
            function pickDate(inp){
              var now=new Date(),mn=inp.min?new Date(inp.min+"T00:00:00"):new Date(1920,0,1),mx=inp.max?new Date(inp.max+"T00:00:00"):new Date(now.getFullYear()+10,11,31);
              var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(inp.value||""),y=m?+m[1]:now.getFullYear(),mo=m?+m[2]:now.getMonth()+1,d=m?+m[3]:now.getDate();
              var ys=[],i;for(i=mn.getFullYear();i<=mx.getFullYear();i++)ys.push(i);
              var MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],ds=[];for(i=1;i<=31;i++)ds.push(String(i));
              var wd=wheel(ds,d-1),wmo=wheel(MN,mo-1),wy=wheel(ys.map(String),Math.max(0,ys.indexOf(y)));
              openSheet("اختر التاريخ",[wd,wmo,wy],function(){
                var Y=ys[wy.get()],M=wmo.get()+1,D=wd.get()+1,last=new Date(Y,M,0).getDate();if(D>last)D=last;
                var v=new Date(Y,M-1,D);if(v<mn)v=mn;if(v>mx)v=mx;
                setVal(inp,v.getFullYear()+"-"+pad2(v.getMonth()+1)+"-"+pad2(v.getDate()));
              });
            }
            document.addEventListener("click",function(e){
              var t=e.target;if(!t||t.tagName!=="INPUT")return;
              if(t.type==="time"||t.type==="date"){e.preventDefault();e.stopPropagation();try{t.blur()}catch(x){}if(t.type==="time")pickTime(t);else pickDate(t)}
            },true);
            window.__pick={pickTime:pickTime,pickDate:pickDate};

            /* tell the native splash which theme the app uses */
            function theme(){try{var m=localStorage.getItem("elagi.theme")||"auto";var d=m==="dark"||(m!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);AndroidElagi.setTheme(!!d)}catch(e){}}
            setInterval(theme,4000);setTimeout(theme,1500);
            window.__nativeSync=sync;
            setInterval(sync,15000);setTimeout(sync,2500);
            document.addEventListener("visibilitychange",sync);
          })();
          EOF_2
          mkdir -p "app/src/main/java/app/elagi"
          cat > 'app/src/main/java/app/elagi/AlarmActivity.java' <<'EOF_3'
          package app.elagi;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONObject;

          /** Lightweight native alarm screen: appears instantly over the lock screen (no web page to wait for). */
          public class AlarmActivity extends Activity {
              private String id = "", title = "عِلاجي", body = "", text = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);
                  read(getIntent());
                  build();
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  read(i);
                  build();
              }

              private void read(Intent i) {
                  if (i == null) return;
                  String v;
                  if ((v = i.getStringExtra("id")) != null) id = v;
                  if ((v = i.getStringExtra("title")) != null) title = v;
                  if ((v = i.getStringExtra("body")) != null) body = v;
                  if ((v = i.getStringExtra("text")) != null) text = v;
              }

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              private Button btn(String label, boolean primary, View.OnClickListener l) {
                  Button x = new Button(this);
                  x.setText(label);
                  x.setAllCaps(false);
                  x.setTextSize(18);
                  x.setTypeface(Typeface.DEFAULT_BOLD);
                  x.setTextColor(primary ? 0xFF04A093 : Color.WHITE);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(18));
                  if (primary) g.setColor(Color.WHITE); else { g.setColor(0x33FFFFFF); g.setStroke(dp(2), 0x88FFFFFF); }
                  x.setBackground(g);
                  x.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(58));
                  lp.topMargin = dp(12);
                  x.setLayoutParams(lp);
                  return x;
              }

              private void build() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(0xFF04A093);
                  root.setPadding(dp(28), dp(40), dp(28), dp(40));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView icon = new TextView(this);
                  icon.setText("💊");
                  icon.setTextSize(64);
                  icon.setGravity(Gravity.CENTER);
                  root.addView(icon);

                  TextView t1 = new TextView(this);
                  t1.setText("حان موعد التنبيه");
                  t1.setTextColor(0xFFE0F5F2);
                  t1.setTextSize(18);
                  t1.setGravity(Gravity.CENTER);
                  t1.setPadding(0, dp(8), 0, 0);
                  root.addView(t1);

                  TextView t2 = new TextView(this);
                  t2.setText(body.isEmpty() ? title : body);
                  t2.setTextColor(Color.WHITE);
                  t2.setTextSize(34);
                  t2.setTypeface(Typeface.DEFAULT_BOLD);
                  t2.setGravity(Gravity.CENTER);
                  t2.setPadding(0, dp(8), 0, dp(6));
                  root.addView(t2);

                  TextView t3 = new TextView(this);
                  t3.setText(text);
                  t3.setTextColor(0xFFE0F5F2);
                  t3.setTextSize(19);
                  t3.setGravity(Gravity.CENTER);
                  t3.setPadding(0, 0, 0, dp(24));
                  root.addView(t3);

                  root.addView(btn("فتح التطبيق", true, new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          Intent i = new Intent(AlarmActivity.this, MainActivity.class);
                          i.putExtra("alarm", true);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(i);
                          stopSound();
                          finish();
                      }
                  }));
                  root.addView(btn("إيقاف الصوت", false, new View.OnClickListener() {
                      @Override public void onClick(View v) { stopSound(); }
                  }));
                  root.addView(btn("ذكّرني بعد 10 دقائق", false, new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          try {
                              JSONObject o = new JSONObject();
                              o.put("id", "snooze_" + id);
                              o.put("at", System.currentTimeMillis() + 10 * 60 * 1000L);
                              o.put("title", title); o.put("body", body); o.put("text", text);
                              AlarmScheduler.addOne(getApplicationContext(), o);
                          } catch (Exception ignored) {}
                          stopSound();
                          finish();
                      }
                  }));
                  setContentView(root);
              }

              private void stopSound() {
                  try { startService(new Intent(this, AlarmService.class).setAction("STOP")); } catch (Exception ignored) {}
              }
          }
          EOF_3
          mkdir -p "app/src/main/java/app/elagi"
          cat > 'app/src/main/java/app/elagi/AlarmReceiver.java' <<'EOF_4'
          package app.elagi;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          import androidx.core.content.ContextCompat;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  if (MainActivity.visible) return; // the open app rings by itself
                  Intent s = new Intent(c, AlarmService.class);
                  s.putExtra("id", intent.getStringExtra("id"));
                  s.putExtra("title", intent.getStringExtra("title"));
                  s.putExtra("body", intent.getStringExtra("body"));
                  s.putExtra("text", intent.getStringExtra("text"));
                  try {
                      ContextCompat.startForegroundService(c, s);
                  } catch (Exception e) {
                      AlarmService.fallbackNotify(c, intent.getStringExtra("title"), intent.getStringExtra("body"));
                  }
              }
          }
          EOF_4
          mkdir -p "app/src/main/java/app/elagi"
          cat > 'app/src/main/java/app/elagi/AlarmScheduler.java' <<'EOF_5'
          package app.elagi;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          final class AlarmScheduler {
              private static final String PREFS = "elagi_alarms", KEY = "items";
              private AlarmScheduler() {}

              private static PendingIntent pi(Context c, String id, JSONObject o, int flags) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.setData(Uri.parse("elagi://alarm/" + id));
                  if (o != null) {
                      i.putExtra("id", id);
                      i.putExtra("title", o.optString("title", "عِلاجي"));
                      i.putExtra("body", o.optString("body", ""));
                      i.putExtra("text", o.optString("text", ""));
                  }
                  return PendingIntent.getBroadcast(c, id.hashCode(), i, flags | PendingIntent.FLAG_IMMUTABLE);
              }

              private static JSONArray load(Context c) {
                  try {
                      return new JSONArray(c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static void sync(Context c, String json) {
                  JSONArray fresh;
                  try { fresh = new JSONArray(json); } catch (Exception e) { return; }
                  SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  JSONArray prev = load(c);
                  for (int k = 0; k < prev.length(); k++) {
                      JSONObject x = prev.optJSONObject(k);
                      if (x != null && (x.optString("id").equals("test") || x.optString("id").startsWith("snooze_")) && x.optLong("at") > System.currentTimeMillis()) fresh.put(x);
                  }
                  if (fresh.toString().equals(sp.getString(KEY, ""))) return;
                  cancelAll(c);
                  sp.edit().putString(KEY, fresh.toString()).apply();
                  scheduleAll(c);
              }

              static void addOne(Context c, JSONObject o) {
                  JSONArray arr = load(c);
                  JSONArray n = new JSONArray();
                  try {
