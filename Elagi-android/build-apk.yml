                      PowerManager.WakeLock sw = pm2.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE, "elagi:screen");
                      sw.acquire(20 * 1000L);
